];const total=Math.round(files.reduce((s,f)=>s+f.p,0)/files.length);document.getElementById('total').textContent=total;document.getElementById('totalbar').style.width=total+'%';const grid=document.getElementById('grid'),home=document.getElementById('home'),detail=document.getElementById('detail'),content=document.getElementById('content');files.forEach((f,i)=>{let b=document.createElement('button');b.className='folder';b.innerHTML=`<div class="ico">${f.icon}</div><div class="name">${f.name}</div><div class="status">${f.status}</div><div class="mini"><span style="width:${f.p}%"></span></div><div class="pct">${f.p}%</div>`;b.onclick=()=>openF(i);grid.appendChild(b)});function openF(i){let f=files[i],d=f.done.length?'<ul>'+f.done.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'لا يوجد بعد',o=f.open.length?'<ul>'+f.open.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'لا توجد نقاط مفتوحة';content.innerHTML=`<div class="dhead"><div class="dicon">${f.icon}</div><div><div class="dtitle">${f.name}</div><div class="status">${f.status}</div></div></div><div class="progressRow"><strong>${f.p}%</strong><div class="bar"><span class="fill" style="width:${f.p}%"></span></div></div><div class="section"><h3>✓ ما تم تثبيته</h3>${d}</div><div class="section"><h3>؟ ما بقي مفتوحاً</h3>${o}</div>`;home.style.display='none';detail.classList.add('active')}document.getElementById('back').onclick=()=>{detail.classList.remove('active');home.style.display='block'};</script></body></html>
