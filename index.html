<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق سوق — مركز المشروع</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f6f8;color:#16181d}.app{min-height:100vh;padding:28px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap}h1{font-size:28px;margin:0 0 6px;font-weight:800}.sub{color:#667085;font-size:14px}.overall{min-width:230px}.bar{height:7px;background:#e0e3e8;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:18%;background:#4c7dff;border-radius:99px}.crumb{font-size:13px;color:#667085;margin:4px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.folder{border:1px solid #dde1e7;background:#fff;border-radius:15px;padding:17px;text-align:right;cursor:pointer;min-height:155px;transition:.15s;position:relative;color:inherit}.folder:hover{transform:translateY(-2px);border-color:#7897ed}.folder:focus-visible{outline:3px solid #7897ed;outline-offset:2px}.ico{font-size:34px;margin-bottom:12px}.name{font-size:16px;font-weight:750;margin-bottom:7px}.status{font-size:12px;color:#667085;margin-bottom:14px}.mini{height:5px;background:#e8eaee;border-radius:20px;overflow:hidden}.mini span{display:block;height:100%;background:#7897ed;border-radius:20px}.pct{font-size:11px;color:#7b8494;margin-top:6px}.detail{display:none;background:#fff;border:1px solid #dde1e7;border-radius:18px;padding:22px}.detail.active{display:block}.back{border:0;background:#edf0f5;color:inherit;border-radius:10px;padding:10px 15px;cursor:pointer;font-size:14px;margin-bottom:18px}.dhead{display:flex;gap:14px;align-items:center;margin-bottom:20px}.dicon{font-size:42px}.dtitle{font-size:22px;font-weight:800}.progressRow{display:flex;align-items:center;gap:12px;margin:15px 0 24px}.progressRow .bar{flex:1;margin:0}.section{border-top:1px solid #e5e7eb;padding-top:17px;margin-top:17px}.section h3{font-size:14px;margin:0 0 10px}ul{margin:0;padding-right:20px;line-height:1.9;font-size:14px}.tag{display:inline-block;border-radius:99px;padding:7px 10px;font-size:12px;background:#eef1f6}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:#667085}@media(prefers-color-scheme:dark){body{background:#111318;color:#f3f4f6}.sub,.crumb,.status{color:#aeb5c2}.folder,.detail{background:#191d24;border-color:#303640}.bar,.mini{background:#2b3039}.back,.tag{background:#292f39}.section{border-top-color:#303640}.pct{color:#9da5b2}}@media(max-width:520px){.app{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.folder{min-height:145px;padding:14px}}
</style>
</head>
<body>
<main class="app" id="souq-project">
<section id="homeView"><div class="top"><div><h1>مركز مشروع سوق</h1><div class="sub">افتح أي ملف لمشاهدة مستوى التقدم وما الذي بقي علينا حسمه.</div></div><div class="overall"><strong>التقدم التخطيطي العام: 18%</strong><div class="bar"><div class="fill"></div></div></div></div><div class="crumb">المشروع / الملفات الرئيسية</div><div class="grid" id="folderGrid"></div><div class="legend"><span>🟢 متقدم</span><span>🟡 قيد العمل</span><span>🔴 يحتاج تحقق</span><span>⚪ لم نبدأ</span></div></section>
<section id="detailView" class="detail" aria-live="polite"><button type="button" class="back" id="backBtn">← العودة إلى الملفات</button><div id="detailContent"></div></section>
</main>
<script>
const files=[
{icon:'🧭',name:'نموذج سوق',status:'🟡 قيد العمل',p:65,done:['تحديد سوق كوسيط رقمي','فصل دور سوق عن ملكية المنتجات','تحديد الأطراف الأساسية في الصفقة'],open:['حسم نطاق الوساطة والمسؤوليات','صياغة النموذج النهائي بعد دراسة القانون'],next:'إكمال دورة الصفقة من البداية للنهاية'},
{icon:'⚙️',name:'محرك الطلب',status:'🟡 قيد التصميم',p:40,done:['تحديد دورة الطلب الأساسية','تحديد الحاجة لمسارات الاستثناء والنزاع'],open:['حالات الطلب بالتفصيل','الإلغاء والفشل والاسترداد','قواعد الانتقال بين الحالات'],next:'رسم State Machine كاملة للطلب'},
{icon:'💳',name:'الدفع والتسوية',status:'🔴 يحتاج تحقق',p:30,done:['تصور حجز قيمة الصفقة حتى التسليم','تصور تقسيم المستحقات بعد الإتمام'],open:['قدرة Sham Cash الفعلية','Split Settlement وAPI','الوضع القانوني للأموال المعلقة'],next:'إعداد متطلبات التفاوض التقني والتجاري مع مزود الدفع'},
{icon:'🚚',name:'الشحن والتوصيل',status:'🔴 يحتاج تحقق',p:35,done:['تصميم مبدئي للشحن متعدد المراحل','إمكانية استخدام أكثر من ناقل'],open:['APIs شركات النقل','التكلفة الفعلية','التغطية والمسؤولية والتعويض'],next:'بناء نموذج Logistics Routing واضح'},
{icon:'🔗',name:'عهدة الطرد',status:'🟢 متقدم مبدئياً',p:60,done:['مبدأ انتقال المسؤولية مع التسليم','Shipment ID وQR','توثيق نقاط التسليم بين الأطراف'],open:['نوع الإثبات المطلوب','الطرود عالية القيمة','قبول الشركات للنموذج'],next:'تحويل المبدأ إلى إجراءات تشغيلية وعقدية'},
{icon:'👤',name:'البائع',status:'⚪ لم نبدأ تفصيلياً',p:10,done:['مبدأ التسجيل السهل'],open:['التحقق من الهوية','إدارة المتجر','المخزون','التقييم والمخالفات'],next:'تصميم رحلة انضمام البائع'},
{icon:'📦',name:'المنتجات',status:'⚪ لم نبدأ',p:5,done:[],open:['نموذج المنتج','التصنيفات','الصور','المخزون','الجديد والمستعمل','سياسة المنتجات'],next:'تصميم Product Model'},
{icon:'🛍️',name:'المشتري',status:'⚪ لم نبدأ',p:5,done:[],open:['التسجيل','العناوين','البحث والسلة','الشراء','التتبع والتقييم'],next:'تصميم رحلة المشتري'},
{icon:'↩️',name:'الإرجاع والنزاعات',status:'🟡 بدأ النقاش',p:20,done:['الفصل بين تغيير الرأي وعدم مطابقة المنتج'],open:['مدة الإرجاع','من يدفع الشحن','إثبات الضرر','إدارة النزاع والتعويض'],next:'إنشاء سياسة نزاعات قابلة للتطبيق'},
{icon:'⚖️',name:'القانون والعقود',status:'🔴 يحتاج دراسة',p:10,done:[],open:['صفة Marketplace القانونية','عقود البائعين','عقود النقل','حماية المستهلك','الخصوصية والدفع'],next:'إعداد قائمة تحقق قانونية سورية'},
{icon:'💰',name:'نموذج الإيرادات',status:'⚪ لم نبدأ',p:0,done:[],open:['العمولة','رسوم الخدمة','تكلفة الدفع والشحن','هامش المساهمة','CAC والمرتجعات'],next:'بناء Unit Economics بعد توفر أسعار حقيقية'},
{icon:'🧠',name:'الذكاء الاصطناعي',status:'⚪ مؤجل',p:5,done:['اعتباره ميزة مساعدة وليس أساس التشغيل'],open:['صياغة المنتجات','البحث والمقارنة','التوصيات','تحليل الصور'],next:'العودة إليه بعد تثبيت دورة الطلب'},
{icon:'🧱',name:'البنية التقنية',status:'⚪ لم نبدأ',p:5,done:['مبدأ عدم الارتباط بمزود واحد'],open:['Backend','Database','APIs','Admin','Security','Audit Trail'],next:'تصميم Architecture بعد حسم العمليات'},
{icon:'🚀',name:'MVP والإطلاق',status:'⚪ لم نبدأ',p:0,done:[],open:['المدينة الأولى','الفئات الأولى','عدد البائعين','ميزات MVP','معايير النجاح'],next:'لا يبدأ قبل تثبيت نموذج التشغيل الأساسي'}];
const grid=document.getElementById('folderGrid'),home=document.getElementById('homeView'),detail=document.getElementById('detailView'),content=document.getElementById('detailContent');
files.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='folder';b.innerHTML=`<div class="ico">${f.icon}</div><div class="name">${f.name}</div><div class="status">${f.status}</div><div class="mini"><span style="width:${f.p}%"></span></div><div class="pct">${f.p}% من التخطيط الأولي</div>`;b.addEventListener('click',()=>openFile(i));grid.appendChild(b)});
function openFile(i){const f=files[i];const done=f.done.length?`<ul>${f.done.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="sub">لا توجد نقاط مكتملة بعد.</div>';const open=f.open.length?`<ul>${f.open.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="sub">لا توجد نقاط مفتوحة.</div>';content.innerHTML=`<div class="dhead"><div class="dicon">${f.icon}</div><div><div class="dtitle">${f.name}</div><div class="status">${f.status}</div></div></div><div class="progressRow"><strong>${f.p}%</strong><div class="bar"><div class="fill" style="width:${f.p}%"></div></div></div><div class="section"><h3>✓ ما تم تثبيته</h3>${done}</div><div class="section"><h3>؟ الملفات المفتوحة والمشاكل</h3>${open}</div><div class="section"><h3>→ الخطوة التالية</h3><span class="tag">${f.next}</span></div>`;home.style.display='none';detail.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('backBtn').addEventListener('click',()=>{detail.classList.remove('active');home.style.display='block';content.innerHTML=''})
</script>
</body></html>
